[project]
name = "educomic"
version = "1.0.0"
description = "Educational comic generation platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.122.0",
    "uvicorn[standard]==0.38.0",
    "openai==2.8.1",
    "httpx==0.28.1",
    "requests==2.32.5",
    "pydantic==2.12.5",
    "python-dotenv==1.2.1",
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "pypdf==6.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.1",
    "pytest-asyncio==1.3.0",
    "hypothesis==6.148.3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
